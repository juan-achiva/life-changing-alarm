<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>알람으로 인생바꾸기 Kakao Bridge</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #faf5ed;
        color: #2c241b;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      main {
        width: min(92vw, 420px);
        padding: 28px 24px;
        border-radius: 20px;
        background: rgba(255, 252, 247, 0.96);
        box-shadow: 0 20px 50px rgba(73, 47, 19, 0.08);
        border: 1px solid rgba(136, 105, 71, 0.16);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.6;
        color: #6b5a48;
      }
      a {
        color: #8d5b2d;
        word-break: break-all;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>알람으로 인생바꾸기로 돌아가는 중</h1>
      <p id="message">잠시만요. 로그인 결과를 앱으로 전달하고 있어요.</p>
      <p id="manual" class="hidden">
        자동으로 돌아가지 않으면 아래 링크를 눌러주세요.<br />
        <a id="manual-link" href="#">앱으로 돌아가기</a>
      </p>
    </main>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const message = document.getElementById("message");
        const manual = document.getElementById("manual");
        const manualLink = document.getElementById("manual-link");

        const state = params.get("state");
        const code = params.get("code");
        const error = params.get("error");
        const errorDescription = params.get("error_description");

        let returnTo = null;

        try {
          if (state) {
            const parsed = JSON.parse(state);
            returnTo = parsed.returnTo;
          }
        } catch (bridgeError) {
          console.error("Failed to parse Kakao state", bridgeError);
        }

        if (!returnTo) {
          message.textContent = "앱 복귀 주소를 찾지 못했어요. 앱으로 돌아가 다시 시도해 주세요.";
          return;
        }

        const nextParams = new URLSearchParams();
        if (code) nextParams.set("code", code);
        if (error) nextParams.set("error", error);
        if (errorDescription) nextParams.set("error_description", errorDescription);
        if (state) nextParams.set("state", state);

        const separator = returnTo.includes("?") ? "&" : "?";
        const nextUrl = `${returnTo}${separator}${nextParams.toString()}`;

        manualLink.href = nextUrl;
        manual.classList.remove("hidden");

        window.location.replace(nextUrl);
      })();
    </script>
  </body>
</html>
